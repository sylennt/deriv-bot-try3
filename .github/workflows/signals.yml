name: Synthetic signals

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (matches the 15m candles)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save signals.csv back to the repo

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websocket-client pandas requests

      - name: Run bot once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python synth_signals.py --once

      - name: Save signal log
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signals.csv || true
          git diff --cached --quiet || (git commit -m "update signals" && git push)
